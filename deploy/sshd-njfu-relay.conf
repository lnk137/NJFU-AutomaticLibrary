# NJFU project relay user only
Match User njfu-relay
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:15003 127.0.0.1:15004
    PermitOpen none
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /bin/false
Match all
